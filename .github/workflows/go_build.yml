name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deps

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./cmd/mozzarella
